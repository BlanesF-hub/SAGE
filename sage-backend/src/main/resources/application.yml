spring:
  application:
    name: sage

  datasource:
    url: jdbc:postgresql://localhost:5432/sage_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT
app:
  jwt:
    secret: SAGE_SECRET_KEY_CHANGE_IN_PRODUCTION_MIN_256_BITS_REQUIRED_HERE
    expiration-ms: 86400000      # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

# Turno config
  turno:
    duracion-minutos: 30
    recordatorio-horas-antes: 24

server:
  port: 8080
